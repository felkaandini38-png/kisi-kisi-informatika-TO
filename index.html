// ===================== FUNGSI PENGACAKAN (SHUFFLE) =====================
// Algoritma Fisher-Yates Shuffle - mengacak array secara acak
function shuffleArray(array) {
  const shuffled = [...array]; // clone array agar tidak mengubah aslinya
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled;
}

function startQuiz() {
  const name = document.getElementById('studentName').value.trim();
  if (!name) { alert("Silakan isi nama lengkap terlebih dahulu!"); return; }
  state.studentName = name;
  state.started = true;
  state.timeLeft = 45 * 60;
  state.timerId = setInterval(updateTimer, 1000);
  renderQuiz();
}

function updateTimer() {
  state.timeLeft--;
  const m = Math.floor(state.timeLeft / 60);
  const s = state.timeLeft % 60;
  const timerEl = document.getElementById('timer');
  if (timerEl) {
    timerEl.textContent = `⏱️ ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    if (state.timeLeft <= 300) timerEl.style.color = '#dc3545';
  }
  if (state.timeLeft <= 0) {
    clearInterval(state.timerId);
    alert("⏰ Waktu habis! Jawaban akan dikumpulkan otomatis.");
    finishQuiz();
  }
}

function renderQuiz() {

    if (i === state.current) cls += ' current';
    else if (state.answers[i] !== null) cls += ' answered';
    if (state.flagged.has(i)) cls += ' flagged';
    navHtml += `<button class="${cls}" onclick="goTo(${i})">${i+1}</button>`;
  }

  let optsHtml = '';
  q.opts.forEach((opt, i) => {
    const sel = state.answers[state.current] === i ? 'selected' : '';
    optsHtml += `
      <label class="option ${sel}" onclick="selectOption(${i})">
        <input type="radio" name="q${state.current}" ${state.answers[state.current]===i?'checked':''}>
        <span><b>${String.fromCharCode(65+i)}.</b> ${opt}</span>
      </label>
    `;
  });

  const isFlagged = state.flagged.has(state.current);

  app.innerHTML = `
    <div class="info-bar">
      <div><b>👤 ${state.studentName}</b></div>
      <div class="timer" id="timer">⏱️ 45:00</div>
      <div class="progress-info">Dijawab: ${answered}/${questions.length}</div>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
    <div class="content">
      <div class="question-nav">${navHtml}</div>
      <div class="question-card">
        <span class="question-number">Soal ${state.current + 1} dari ${questions.length} 🔀</span>
        <div class="question-text">${q.q}</div>
        <div class="options">${optsHtml}</div>
      </div>
      <div class="nav-buttons">
        <button class="btn btn-secondary" onclick="prevQ()" ${state.current===0?'disabled':''}>← Sebelumnya</button>
        <button class="btn btn-secondary" onclick="toggleFlag()" style="background:${isFlagged?'#ffc107':'#6c757d'}">
          ${isFlagged?'🚩 Ditandai':'🏳️ Tandai'}
        </button>
        ${state.current === questions.length - 1 
          ? `<button class="btn btn-success" onclick="confirmSubmit()">✓ Kumpulkan</button>`
          : `<button class="btn btn-primary" onclick="nextQ()">Selanjutnya →</button>`}
      </div>
      <div style="text-align:center; margin-top:15px;">
        <button class="btn btn-success" onclick="confirmSubmit()">✓ Kumpulkan Jawaban</button>
      </div>
    </div>
  `;
  updateTimerDisplay();
}

function updateTimerDisplay() {
  const m = Math.floor(state.timeLeft / 60);
  const s = state.timeLeft % 60;
  const timerEl = document.getElementById('timer');
  if (timerEl) {
    timerEl.textContent = `⏱️ ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    if (state.timeLeft <= 300) timerEl.style.color = '#dc3545';
  }
}

function selectOption(i) {
  state.answers[state.current] = i;
  renderQuiz();
}

function nextQ() { if (state.current < questions.length - 1) { state.current++; renderQuiz(); } }
function prevQ() { if (state.current > 0) { state.current--; renderQuiz(); } }
function goTo(i) { state.current = i; renderQuiz(); }
function toggleFlag() {
  if (state.flagged.has(state.current)) state.flagged.delete(state.current);
  else state.flagged.add(state.current);
  renderQuiz();
}

function confirmSubmit() {
  const unanswered = state.answers.filter(a => a === null).length;
  let msg = "Apakah Anda yakin ingin mengumpulkan jawaban?";
  if (unanswered > 0) msg += `\n\n⚠️ Masih ada ${unanswered} soal yang belum dijawab!`;
  if (confirm(msg)) finishQuiz();
}

function finishQuiz() {
  clearInterval(state.timerId);
  state.finished = true;
  let correct = 0, wrong = 0, empty = 0;
  state.answers.forEach((a, i) => {
    if (a === null) empty++;
    else if (a === questions[i].ans) correct++;
    else wrong++;
  });
  const score = correct * 4;
  const maxScore = questions.length * 4;
  const percent = Math.round((score / maxScore) * 100);
  
  let reviewHtml = '';
  questions.forEach((q, i) => {
    const userAns = state.answers[i];
    const isCorrect = userAns === q.ans;
    const status = userAns === null ? 'empty' : (isCorrect ? 'correct' : 'wrong');
    
    let optsReview = '';
    q.opts.forEach((opt, j) => {
      let cls = 'option';
      if (j === q.ans) cls += ' correct';
      else if (j === userAns && !isCorrect) cls += ' wrong';
      optsReview += `<div class="${cls}"><b>${String.fromCharCode(65+j)}.</b> ${opt}${j===q.ans?' ✓':''}${j===userAns && !isCorrect?' ✗':''}</div>`;
    });
    
    let feedback = '';
    if (userAns === null) feedback = '<div class="feedback wrong-fb">⚠️ Tidak dijawab</div>';
    else if (isCorrect) feedback = '<div class="feedback correct-fb">✓ Jawaban Anda benar!</div>';
    else feedback = `<div class="feedback wrong-fb">✗ Jawaban Anda salah. Jawaban benar: <b>${String.fromCharCode(65+q.ans)}</b></div>`;
    
    reviewHtml += `
      <div class="question-card" style="border-left: 5px solid ${status==='correct'?'#28a745':status==='wrong'?'#dc3545':'#6c757d'}">
        <span class="question-number">Soal ${i+1}</span>
        <div class="question-text">${q.q}</div>
        <div class="options">${optsReview}</div>
        ${feedback}
      </div>
    `;
  });

  app.innerHTML = `
    <div class="content">
      <div class="result-box">
        <h2 style="color:#1e3c72; margin-bottom:10px;">🎉 Hasil Kisi-Kisi Ujian</h2>
        <p style="color:#6c757d;">${state.studentName}</p>
        <div class="score-circle" style="--p:${percent}%">
          <div class="score-inner">
            <div class="score-value">${score}</div>
            <div class="score-label">dari ${maxScore}</div>
          </div>
        </div>
        <p style="font-size:1.2rem; font-weight:bold; color:${percent>=75?'#28a745':percent>=60?'#ffc107':'#dc3545'}">
          ${percent >= 85 ? '🏆 Luar Biasa!' : percent >= 75 ? '⭐ Sangat Baik!' : percent >= 60 ? '👍 Baik' : percent >= 50 ? '📚 Cukup, Terus Belajar!' : '💪 Perlu Belajar Lagi!'}
        </p>
        <div class="result-stats">
          <div class="stat-card correct"><div class="stat-value">${correct}</div><div class="stat-label">✓ Benar</div></div>
          <div class="stat-card wrong"><div class="stat-value">${wrong}</div><div class="stat-label">✗ Salah</div></div>
          <div class="stat-card empty"><div class="stat-value">${empty}</div><div class="stat-label">⚠️ Kosong</div></div>
          <div class="stat-card"><div class="stat-value" style="color:#667eea">${percent}%</div><div class="stat-label">Persentase</div></div>
        </div>
      </div>
      <h3 style="margin:20px 0 15px; color:#1e3c72;">📋 Pembahasan Lengkap</h3>
      ${reviewHtml}
      <div style="text-align:center; margin-top:20px;">
        <button class="btn btn-primary" onclick="location.reload()">🔄 Ulangi Quiz (Soal Akan Diacak Lagi)</button>
      </div>
    </div>
  `;
  window.scrollTo(0,0);
}

renderStart();
</script>
</body>
</html>
